<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Healthy Diet Layout</title>
  <link rel="stylesheet" href="week04hw.css">
</head>
<body>

  <main class="page-container">
    <h1 class="page-title">Healthy Diet</h1>

    <div class="composition">
      <div class="ring-inner"></div>
      <div class="ring-outer"></div>

      <!-- Core Element -->
      <div class="core-node">
        <span>Whole Foods</span>
      </div>

      <!-- Outer Elements -->
      <div class="satellite sat-primary">
        <strong>Everyday Essentials</strong>
        Veggies, fruit, grains, beans, and water.
      </div>

      <div class="satellite sat-secondary">
        <strong>Good Habits</strong>
        Cooking at home and eating on a schedule.
      </div>

      <div class="satellite sat-tertiary">
        <strong>Sometimes Foods</strong>
        Salty snacks, soda, and fried foods.
      </div>
    </div>
  </main>

</body>
</html>
